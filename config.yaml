# Suivi des dossiers
name: Suivi des dossiers
version: "1.0.0"
slug: suivi_dossiers
description: Suivi et gestion des dossiers administratifs (accusés, retraits, visas) avec base SQLite persistante
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:folder-account
panel_title: Dossiers
panel_admin: false
map:
  - type: share
    read_only: true
options:
  port:
    type: text
    name: Port d'exposition
    description: Port sur lequel l'application sera accessible (exposé via ingress)
    default: "8000"
environment:
  - name: PORT
    value: "{{ options.port }}"
